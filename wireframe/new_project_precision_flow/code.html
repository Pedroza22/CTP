<body class="bg-background text-on-surface font-body-md min-h-screen">
<!-- TopAppBar -->

</div>
<!-- Field: Description -->
<div class="flex flex-col gap-1">
<label class="font-body-sm text-body-sm text-on-surface-variant ml-1">Description</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline resize-none" placeholder="Outline the project goals and core objectives..." rows="4"></textarea>
</div>
<!-- Date Range Group -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="font-body-sm text-body-sm text-on-surface-variant ml-1">Start Date</label>

</div>
</div>

</div>
</div>
</div>

</div>

</div>

</button>

<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-xl shadow-lg shadow-primary/20 hover:bg-primary transition-all active:scale-95 flex items-center justify-center gap-2 mt-4" type="submit">
